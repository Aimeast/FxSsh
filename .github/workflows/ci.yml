name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          # .NET 11 is still in RC at the time of writing; drop this once the
          # runners ship the GA SDK.
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore

      - name: Verify code style
        run: dotnet format --verify-no-changes --no-restore

  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Build
        run: dotnet build --configuration Release

      # Scoped to the unit project so the coverage baseline stays unit-only
      # and the integration job below owns the real-client runs. The binary
      # .coverage file is uploaded so the coverage job can merge it with the
      # integration runs into one combined report.
      - name: Run unit tests
        run: >-
          dotnet test FxSsh.Tests/FxSsh.Tests.csproj --configuration Release --no-build
          --results-directory ${{ runner.temp }}/test-results
          --report-trx --coverage --coverage-output ${{ runner.temp }}/test-results/unit.coverage

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-results-${{ matrix.os }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn
          retention-days: 7

  integration:
    name: OpenSSH integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # The system OpenSSH on windows-latest (9.5) predates some algorithms
      # in the library's catalog (mlkem768x25519-sha256 needs 9.9+). Install
      # the latest Win32-OpenSSH client for full negotiation coverage; it is
      # a plain zip - no service install - picked up via FXSSH_OPENSSH_DIR.
      - name: Install latest Win32-OpenSSH (client)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/PowerShell/Win32-OpenSSH/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -eq 'OpenSSH-Win64.zip' } | Select-Object -First 1
          if (-not $asset) { throw "OpenSSH-Win64.zip not found in release $($release.tag_name)" }
          $zipPath = Join-Path $env:RUNNER_TEMP 'OpenSSH-Win64.zip'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          $dest = Join-Path $env:RUNNER_TEMP 'openssh'
          Expand-Archive -Path $zipPath -DestinationPath $dest -Force
          $binDir = Join-Path $dest 'OpenSSH-Win64'
          if (-not (Test-Path (Join-Path $binDir 'ssh.exe'))) { throw "ssh.exe not found in $binDir" }
          "FXSSH_OPENSSH_DIR=$binDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: dotnet build FxSsh.IntegrationTests/FxSsh.IntegrationTests.csproj --configuration Release

      # Coverage is collected here too: the real-client runs exercise the
      # handshake, PTY and transport code paths that unit tests cannot
      # reach. The coverage job merges all four .coverage files.
      - name: Run OpenSSH integration tests
        run: >-
          dotnet test FxSsh.IntegrationTests/FxSsh.IntegrationTests.csproj
          --configuration Release --no-build
          --results-directory ${{ runner.temp }}/test-results
          --report-trx --coverage --coverage-output ${{ runner.temp }}/test-results/integration.coverage

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-results-${{ matrix.os }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Combined coverage
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - name: Download unit coverage (ubuntu)
        uses: actions/download-artifact@v8
        with:
          name: unit-results-ubuntu-latest
          path: coverage/unit-ubuntu

      - name: Download unit coverage (windows)
        uses: actions/download-artifact@v8
        with:
          name: unit-results-windows-latest
          path: coverage/unit-windows

      - name: Download integration coverage (ubuntu)
        uses: actions/download-artifact@v8
        with:
          name: integration-results-ubuntu-latest
          path: coverage/integration-ubuntu

      - name: Download integration coverage (windows)
        uses: actions/download-artifact@v8
        with:
          name: integration-results-windows-latest
          path: coverage/integration-windows

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Install dotnet-coverage
        run: dotnet tool install -g dotnet-coverage

      - name: Merge coverage from all four runs
        shell: bash
        run: |
          "$HOME/.dotnet/tools/dotnet-coverage" merge \
            -f cobertura \
            -o combined.cobertura.xml \
            coverage/unit-ubuntu/unit.coverage \
            coverage/unit-windows/unit.coverage \
            coverage/integration-ubuntu/integration.coverage \
            coverage/integration-windows/integration.coverage

      - name: Upload combined coverage
        uses: actions/upload-artifact@v7
        with:
          name: combined-coverage
          path: combined.cobertura.xml
          retention-days: 7

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      # MarkdownSummaryGithub renders the totals straight onto the run's
      # summary page; the self-contained HTML report is uploaded for
      # per-namespace / per-class drill-down.
      - name: Generate coverage report
        shell: bash
        run: |
          "$HOME/.dotnet/tools/reportgenerator" \
            -reports:combined.cobertura.xml \
            -targetdir:coverage-report \
            -reporttypes:"HtmlInline;MarkdownSummaryGithub"

      - name: Publish coverage summary
        shell: bash
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report
          retention-days: 14

  # Deploys the coverage job's already-generated report to GitHub Pages.
  # This is an artifact deployment - it never commits to or pushes to any
  # branch. The site also hosts the shields.io endpoint JSON that the
  # README coverage badge reads.
  coverage-pages:
    name: Publish coverage report
    runs-on: ubuntu-latest
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: site

      - name: Download combined coverage
        uses: actions/download-artifact@v8
        with:
          name: combined-coverage
          path: coverage

      - name: Write coverage badge JSON
        shell: bash
        run: |
          PCT=$(python3 -c "import xml.etree.ElementTree as ET; r = ET.parse('coverage/combined.cobertura.xml').getroot(); c, v = int(r.get('lines-covered', 0)), int(r.get('lines-valid', 0)); print(round(100 * c / v) if v else 0)")
          if [ "$PCT" -ge 90 ]; then COLOR=brightgreen
          elif [ "$PCT" -ge 80 ]; then COLOR=green
          elif [ "$PCT" -ge 70 ]; then COLOR=yellowgreen
          elif [ "$PCT" -ge 50 ]; then COLOR=yellow
          else COLOR=red
          fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > site/coverage.json
          cat site/coverage.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
